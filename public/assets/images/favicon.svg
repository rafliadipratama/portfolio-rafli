<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Trilinear Gradient matching navbar border from-[#00f0ff] via-[#9d4edd] to-[#ff007f] -->
    <linearGradient id="navBrandGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
  </defs>

  <!-- Gradient Border Container (rounded-xl) -->
  <rect x="32" y="32" width="448" height="448" rx="112" ry="112" fill="url(#navBrandGrad)" />

  <!-- Inner Dark Background (#070a1e) -->
  <rect x="52" y="52" width="408" height="408" rx="94" ry="94" fill="#070a1e" />

  <!-- Lucide Code2 Icon (<Code2 className="text-[#00f0ff]" />) -->
  <g transform="translate(112, 112) scale(12)" 
     stroke="#00f0ff" 
     stroke-width="2.3" 
     stroke-linecap="round" 
     stroke-linejoin="round" 
     fill="none">
    <path d="m18 16 4-4-4-4" />
    <path d="m6 8-4 4 4 4" />
    <path d="m14.5 4-5 16" />
  </g>
</svg>
