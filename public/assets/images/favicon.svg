<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Trilinear Gradient matching navbar border from-[#00f0ff] via-[#9d4edd] to-[#ff007f] -->
    <linearGradient id="navBrandGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
  </defs>

  <!-- Gradient Border Container (rounded-xl) -->
  <rect x="24" y="24" width="440" height="440" rx="110" ry="110" fill="url(#navBrandGrad)" />

  <!-- Inner Dark Background (#070a1e) -->
  <rect x="42" y="42" width="404" height="404" rx="95" ry="95" fill="#070a1e" />

  <!-- Lucide Code2 Icon (<Code2 className="text-[#00f0ff]" />) -->
  <g transform="translate(112, 112) scale(11)" 
     stroke="#00f0ff" 
     stroke-width="2.3" 
     stroke-linecap="round" 
     stroke-linejoin="round" 
     fill="none">
    <path d="m18 16 4-4-4-4" />
    <path d="m6 8-4 4 4 4" />
    <path d="m14.5 4-5 16" />
  </g>

  <!-- Bottom-Right Status Indicator Dot (#00ff9d with #050713 border) -->
  <circle cx="436" cy="436" r="54" fill="#050713" />
  <circle cx="436" cy="436" r="48" fill="#00ff9d" opacity="0.35" />
  <circle cx="436" cy="436" r="38" fill="#00ff9d" />
</svg>
